<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LSR - Laboratório de Software Responsável</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react.development.js"
    ></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body
    class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-950"
  >
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [activeTab, setActiveTab] = React.useState("home");

        React.useEffect(() => {
          lucide.createIcons();
        }, [activeTab]);

        return (
          <div className="min-h-screen flex flex-col bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
            {/* Header */}
            <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div
                  className="flex items-center space-x-3 cursor-pointer"
                  onClick={() => setActiveTab("home")}
                >
                  <div className="bg-cyan-500 text-slate-950 p-2 rounded-xl font-bold flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i data-lucide="cpu" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <span className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                      LSR
                    </span>
                    <span className="block text-xs text-slate-400">
                      Laboratório de Software Responsável
                    </span>
                  </div>
                </div>
                <nav className="hidden md:flex items-center space-x-6">
                  <button
                    onClick={() => setActiveTab("home")}
                    className={`text-sm font-medium transition-colors hover:text-cyan-400 ${activeTab === "home" ? "text-cyan-400" : "text-slate-300"}`}
                  >
                    Início
                  </button>
                  <button
                    onClick={() => setActiveTab("audits")}
                    className={`text-sm font-medium transition-colors hover:text-cyan-400 ${activeTab === "audits" ? "text-cyan-400" : "text-slate-300"}`}
                  >
                    Auditorias & Relatórios
                  </button>
                  <button
                    onClick={() => setActiveTab("questionnaires")}
                    className={`text-sm font-medium transition-colors hover:text-cyan-400 ${activeTab === "questionnaires" ? "text-cyan-400" : "text-slate-300"}`}
                  >
                    Questionários
                  </button>
                </nav>
                <div>
                  <button
                    onClick={() => setActiveTab("questionnaires")}
                    className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-4 py-2 rounded-lg font-semibold text-sm transition-all shadow-lg shadow-cyan-500/20"
                  >
                    Iniciar Avaliação
                  </button>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1">
              {activeTab === "home" && (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                  <div className="text-center max-w-3xl mx-auto space-y-6">
                    <span className="inline-flex items-center gap-1.5 py-1.5 px-3 rounded-full text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                      <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>{" "}
                      Governança e Qualidade de Software
                    </span>
                    <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight text-white">
                      Engenharia de Software com{" "}
                      <span className="bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                        Responsabilidade
                      </span>
                    </h1>
                    <p className="text-lg text-slate-400">
                      O LSR (Laboratório de Software Responsável) desenvolve
                      frameworks de avaliação, relatórios automatizados em PDF e
                      diretrizes técnicas para sistemas seguros, eficientes e
                      auditáveis.
                    </p>
                    <div className="flex flex-wrap justify-center gap-4 pt-4">
                      <button
                        onClick={() => setActiveTab("questionnaires")}
                        className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-6 py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20 flex items-center gap-2"
                      >
                        Acessar Questionários{" "}
                        <i data-lucide="arrow-right" className="w-4 h-4"></i>
                      </button>
                      <button
                        onClick={() => setActiveTab("audits")}
                        className="bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 font-semibold px-6 py-3 rounded-xl transition-all"
                      >
                        Ver Relatórios
                      </button>
                    </div>
                  </div>

                  {/* Features Grid */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mt-20">
                    <div className="bg-slate-900/50 border border-slate-800/80 p-6 rounded-2xl backdrop-blur">
                      <div className="w-12 h-12 bg-cyan-500/10 text-cyan-400 rounded-xl flex items-center justify-center mb-4">
                        <i data-lucide="file-text" className="w-6 h-6"></i>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-2">
                        Geração de Laudos em PDF
                      </h3>
                      <p className="text-slate-400 text-sm">
                        Estruturação automática de relatórios de auditoria a
                        partir de datasets JSON estruturados com rigor técnico.
                      </p>
                    </div>
                    <div className="bg-slate-900/50 border border-slate-800/80 p-6 rounded-2xl backdrop-blur">
                      <div className="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center mb-4">
                        <i data-lucide="check-circle-2" className="w-6 h-6"></i>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-2">
                        Avaliação de Conformidade
                      </h3>
                      <p className="text-slate-400 text-sm">
                        Questionários dinâmicos e fluxos guiados para checagem
                        de boas práticas de desenvolvimento e arquitetura.
                      </p>
                    </div>
                    <div className="bg-slate-900/50 border border-slate-800/80 p-6 rounded-2xl backdrop-blur">
                      <div className="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center mb-4">
                        <i data-lucide="terminal" className="w-6 h-6"></i>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-2">
                        Mentoria & Prática
                      </h3>
                      <p className="text-slate-400 text-sm">
                        Integração com conceitos modernos de stack web, bancos
                        de dados e automações inteligentes baseadas em IA.
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === "audits" && (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                  <h2 className="text-3xl font-bold text-white mb-6">
                    Auditorias & Relatórios
                  </h2>
                  <p className="text-slate-400 mb-8">
                    Lista de relatórios e laudos gerados pelo framework do LSR.
                  </p>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center text-slate-400">
                    <i
                      data-lucide="folder-open"
                      className="w-12 h-12 mx-auto mb-3 opacity-50"
                    ></i>
                    Nenhum relatório pendente de auditoria no momento. Utilize
                    os questionários para gerar novas análises.
                  </div>
                </div>
              )}

              {activeTab === "questionnaires" && (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                  <h2 className="text-3xl font-bold text-white mb-2">
                    Área de Questionários
                  </h2>
                  <p className="text-slate-400 mb-8">
                    Selecione uma trilha de avaliação de software responsável:
                  </p>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl hover:border-cyan-500/50 transition-all cursor-pointer">
                      <h3 className="text-xl font-semibold text-white mb-2">
                        Avaliação de Qualidade de Código
                      </h3>
                      <p className="text-slate-400 text-sm mb-4">
                        Questionário focado em manutenibilidade, testes
                        automatizados e padrões arquiteturais.
                      </p>
                      <span className="text-cyan-400 text-sm font-medium flex items-center gap-1">
                        Iniciar questionário{" "}
                        <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </span>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl hover:border-cyan-500/50 transition-all cursor-pointer">
                      <h3 className="text-xl font-semibold text-white mb-2">
                        Auditoria de Segurança e Dados
                      </h3>
                      <p className="text-slate-400 text-sm mb-4">
                        Verificação de conformidade com padrões de proteção de
                        dados e boas práticas de API.
                      </p>
                      <span className="text-cyan-400 text-sm font-medium flex items-center gap-1">
                        Iniciar questionário{" "}
                        <i data-lucide="chevron-right" className="w-4 h-4"></i>
                      </span>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="border-t border-slate-800 py-6 text-center text-sm text-slate-500">
              <p>
                © 2026 Laboratório de Software Responsável (LSR). Todos os
                direitos reservados.
              </p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
